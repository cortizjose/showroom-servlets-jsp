# ------------------------------------------------------------------------------
# Configuracion de la conexion a la base de datos
#
# Este archivo se copia a WEB-INF/classes al compilar, de modo que viaja dentro
# de la aplicacion y ConexionBD lo encuentra en el classpath.
#
# Los valores corresponden a una instalacion de XAMPP recien instalada: usuario
# root sin contrasena. En un servidor real se crea un usuario propio para la
# aplicacion, con permisos solo sobre esta base de datos.
# ------------------------------------------------------------------------------

bd.driver=com.mysql.cj.jdbc.Driver
bd.url=jdbc:mysql://localhost:3306/showroom_servlets?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8
bd.usuario=root
bd.contrasena=
